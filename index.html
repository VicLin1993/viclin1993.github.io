<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密調整基地 // Nacos 登入</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #00f0ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: rgba(13, 22, 33, 0.85); border: 1px solid #00f0ff; padding: 40px; border-radius: 6px; width: 100%; max-width: 440px; }
        .title-area { margin-bottom: 30px; text-align: center; }
        .title-area h2 { font-size: 22px; color: #00ff88; margin-bottom: 8px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: #00f0ff; margin-bottom: 8px; }
        .input-group input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 4px; padding: 12px; color: #00ff88; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: transparent; border: 1px solid #00f0ff; color: #00f0ff; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-submit:hover { background: #00f0ff; color: #0d1117; }
        .error-tip { color: #ff5555; font-size: 13px; margin-top: 15px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="title-area">
        <h2>秘密調整基地</h2>
        <p>接入真實 Nacos 控制台</p>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <label for="username">> 管理帳號</label>
            <input type="text" id="username" value="nacos" autocomplete="off" required>
        </div>

        <div class="input-group">
            <label for="password">> 安全密鑰</label>
            <input type="password" id="password" value="Ruv6B-WR@SF68g@5" required>
        </div>

        <button type="submit" class="btn-submit">連 接 控 制 台</button>
        <div id="errorMsg" class="error-tip"></div>
    </form>
</div>

<script>
    const SERVER_URL = 'https://nacos.wayturnlive.com';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.style.display = 'none';

        try {
            const response = await fetch(`${SERVER_URL}/nacos/v1/auth/users/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username, password })
            });

            const data = await response.json();

            if (response.ok && data.accessToken) {
                localStorage.setItem('nacos_access_token', data.accessToken);
                localStorage.setItem('nacos_server_url', SERVER_URL);
                localStorage.setItem('is_authenticated', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.innerText = `[!] 登入失敗: ${data.message || '帳號或密碼錯誤'}`;
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.innerText = `[!] 連線異常: ${err.message}`;
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
