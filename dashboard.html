<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密调整基地 // 控制台</title>
    <!-- 1. 最先引入本地环境配置 -->
    <script src="./env.js"></script>
    <script>
        // 核心兜底逻辑：在页面所有脚本加载前，强行将 env.js 里的地址同步入 localStorage
        (function() {
            if (window.ENV && window.ENV.SERVER_URL) {
                localStorage.setItem('nacos_server_url', window.ENV.SERVER_URL);
            }
        })();
    </script>
</head>
<body>

<script>
    // 权限校验
    if (localStorage.getItem('is_authenticated') !== 'true') {
        window.location.href = 'index.html';
    }

    // 全局使用的 Nacos 地址，优先读取 env.js，其次读取缓存
    const SERVER_URL = (window.ENV && window.ENV.SERVER_URL) 
        || localStorage.getItem('nacos_server_url') 
        || '';
        
    const PAGE_SIZE = (window.ENV && window.ENV.PAGE_SIZE) || 100;

    if (!SERVER_URL) {
        console.error('⚠️ 未检测到有效的 Nacos 后端服务地址，请检查 env.js 文件！');
    }
</script>

<div id="app">
    <!-- 你的 dashboard 原有 DOM 结构 -->
</div>

<script src="js/compare.js"></script>
<script src="js/debug-logger.js"></script>
</body>
</html>
