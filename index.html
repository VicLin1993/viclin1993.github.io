<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密调整基地 // 身份验证</title>
    <script src="js/auth-config.js"></script>
    <script src="js/crypto.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #00f0ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: rgba(13, 22, 33, 0.85); border: 1px solid #00f0ff; padding: 40px; border-radius: 6px; width: 100%; max-width: 440px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
        .title-area { margin-bottom: 30px; text-align: center; }
        .title-area h2 { font-size: 22px; color: #00ff88; margin-bottom: 8px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: #00f0ff; margin-bottom: 8px; }
        .input-group input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 4px; padding: 12px; color: #00ff88; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #00ff88; box-shadow: 0 0 8px rgba(0, 255, 136, 0.3); }
        .btn-submit { width: 100%; padding: 12px; background: transparent; border: 1px solid #00f0ff; color: #00f0ff; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-submit:hover { background: #00f0ff; color: #0d1117; }
        .error-tip { color: #ff5555; font-size: 13px; margin-top: 15px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="title-area">
        <h2>秘密调整基地</h2>
        <p>个人控制台授权验证</p>
    </div>
    <form id="loginForm">
        <div class="input-group">
            <label>> 专属账号</label>
            <input type="text" id="username" autocomplete="off" required>
        </div>
        <div class="input-group">
            <label>> 身份密钥</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn-submit">接 入 控 制 台</button>
        <div id="errorMsg" class="error-tip"></div>
    </form>
</div>

<script>
    const FRONTEND_USER = 'viclin';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const err = document.getElementById('errorMsg');
        err.style.display = 'none';

        if (u !== FRONTEND_USER) {
            err.innerText = '[!] 账号或密钥不正确';
            err.style.display = 'block';
            return;
        }
        if (!window.AUTH_CFG) {
            err.innerText = '[!] 缺少 js/auth-config.js，请先生成';
            err.style.display = 'block';
            return;
        }

        const cfg = window.AUTH_CFG;
        const testCfg = await decryptNacosCfg(p, cfg.SALT, cfg.ITER, cfg.ENC_TEST);
        if (!testCfg) {
            err.innerText = '[!] 账号或密钥不正确';
            err.style.display = 'block';
            return;
        }
        const prodCfg = await decryptNacosCfg(p, cfg.SALT, cfg.ITER, cfg.ENC_PROD);

        sessionStorage.setItem('nacos_test_cfg', JSON.stringify(testCfg));
        sessionStorage.setItem('nacos_prod_cfg', JSON.stringify(prodCfg));

        try {
            const r = await fetch(`${testCfg.url}/nacos/v1/auth/users/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username: testCfg.user, password: testCfg.pass })
            });
            const d = await r.json();
            if (d && d.accessToken) {
                localStorage.setItem('nacos_access_token', d.accessToken);
                localStorage.setItem('nacos_server_url', testCfg.url);
                localStorage.setItem('nacos_server_addr', testCfg.url);
                localStorage.setItem('current_env', 'test');
                window.location.href = 'dashboard.html';
            } else {
                err.innerText = '[!] Nacos 登录失败: ' + (d.message || '未知');
                err.style.display = 'block';
            }
        } catch (ex) {
            err.innerText = '[!] 网络异常: ' + ex.message;
            err.style.display = 'block';
        }
    });
</script>
</body>
</html>
