<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密调整基地 // Nacos 控制台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 左侧栏 -->
    <aside>
        <div>
            <div class="sidebar-brand">
                <h2>秘密调整基地</h2>
                <p>Nacos 独立控制台</p>
            </div>
            <ul class="nav-list">
                <li class="nav-item active" onclick="switchTab('overview')">
                    <span>1. 概览</span>
                </li>
                <li class="nav-item" onclick="switchTab('search')">
                    <span>2. 查询 (版本对比)</span>
                </li>
                <li class="nav-item" onclick="switchTab('edit')">
                    <span>3. 修改</span>
                </li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </aside>

    <!-- 右侧内容视窗 -->
    <main>
        <!-- 视窗 1：概览 -->
        <section id="view-overview" class="view-section active">
            <div class="section-header">
                <div class="section-title">> 命名空间概览</div>
                <button class="page-btn" onclick="fetchNamespaces()">刷新数据</button>
            </div>

            <div class="toolbar">
                <div style="font-size:13px; color:#58a6ff;">全量 Namespace 列表（共 <span id="nsTotalCount">0</span> 个）</div>
                <input type="text" id="searchInput" class="search-box" placeholder="搜索命名空间名称 / ID..." oninput="onSearchInput()">
            </div>

            <div id="statusMsg" class="status-msg"></div>
            <div id="namespaceContainer" class="namespace-grid"></div>

            <div class="pagination-container">
                <div class="pagination-info">
                    每页 100 条 | 页数：<span id="pageCurrentText">1</span> / <span id="pageTotalText">1</span>
                </div>
                <div class="pagination-controls" id="paginationControls"></div>
            </div>
        </section>

        <!-- 视窗 1-Detail：配置详情 -->
        <section id="view-configs" class="view-section">
            <div class="section-header">
                <div class="section-title">
                    <button class="btn-back" onclick="switchTab('overview')">← 返回概览</button>
                    <span>命名空间配置：<span id="currentNsTitle" style="color: #00f0ff;"></span></span>
                </div>
                <button class="page-btn" onclick="loadConfigsOfNamespace(activeNamespaceId)">刷新列表</button>
            </div>

            <div class="filter-panel">
                <div class="filter-item">
                    <label for="filterDataId">Data ID:</label>
                    <input type="text" id="filterDataId" class="filter-input" placeholder="支持模糊匹配 Data ID..." oninput="applyCombinedFilter()">
                </div>
                <div class="filter-item">
                    <label for="filterGroup">Group:</label>
                    <input type="text" id="filterGroup" class="filter-input" placeholder="例如: SIT 或 DEFAULT_GROUP..." oninput="applyCombinedFilter()">
                </div>
                <button class="btn-search" onclick="applyCombinedFilter()">查 询</button>
                <button class="btn-reset" onclick="resetConfigFilter()">重 置</button>
                <div style="margin-left:auto; font-size:13px; color:#58a6ff;">符合条件配置: <span id="configFilteredCount" style="color:#00ff88; font-weight:bold;">0</span> 项</div>
            </div>

            <div id="configStatusMsg" class="status-msg"></div>

            <table class="nacos-table">
                <thead>
                    <tr>
                        <th>Data Id</th>
                        <th>Group</th>
                        <th>归属应用</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="configTableBody"></tbody>
            </table>
        </section>

        <!-- 视窗 2：独立多版本自由对比 -->
        <section id="view-search" class="view-section">
            <div class="section-header">
                <div class="section-title">> 配置版本多重对比中心</div>
            </div>

            <!-- 顶部固定多维筛选与版本选择控制栏 -->
            <div class="filter-panel" style="gap:12px;">
                <div class="filter-item">
                    <label for="compareNsSelect">命名空间:</label>
                    <select id="compareNsSelect" class="filter-input" style="width:160px; cursor:pointer;" onchange="onCompareNsChange()"></select>
                </div>
                <div class="filter-item">
                    <label for="compareDataId">Data ID / YAML:</label>
                    <input type="text" id="compareDataId" class="filter-input" placeholder="如 im-admin.yaml" style="width:180px;">
                </div>
                <div class="filter-item">
                    <label for="compareGroup">Group:</label>
                    <input type="text" id="compareGroup" class="filter-input" placeholder="如 SIT" style="width:120px;">
                </div>
                <button class="btn-search" onclick="fetchHistoryAndCompare()">查询历史</button>

                <div style="width:100%; height:1px; background:rgba(0,240,255,0.15); margin:4px 0;"></div>

                <!-- 版本自由下拉切换 -->
                <div class="filter-item">
                    <label for="compareLeftVersion" style="color:#ff5555;">← 左侧对比版:</label>
                    <select id="compareLeftVersion" class="filter-input" style="width:230px; border-color:#ff5555; cursor:pointer;" onchange="triggerDiffRender()"></select>
                </div>
                <div class="filter-item">
                    <label for="compareRightVersion" style="color:#00ff88;">→ 右侧基准版:</label>
                    <select id="compareRightVersion" class="filter-input" style="width:230px; border-color:#00ff88; cursor:pointer;" onchange="triggerDiffRender()"></select>
                </div>
            </div>

            <div id="compareStatusMsg" class="status-msg"></div>

            <!-- 左右分屏对比区域 -->
            <div id="diffContainer" class="diff-container">
                <div class="diff-pane diff-pane-left">
                    <div class="diff-pane-header" id="leftPaneTitle">← 历史对比版本</div>
                    <div class="diff-body" id="leftDiffBody">请在上方选择命名空间并输入 Data ID / Group 查询版本...</div>
                </div>
                <div class="diff-pane diff-pane-right">
                    <div class="diff-pane-header" id="rightPaneTitle">→ 最新/基准版本</div>
                    <div class="diff-body" id="rightDiffBody">请在上方选择命名空间并输入 Data ID / Group 查询版本...</div>
                </div>
            </div>
        </section>

        <!-- 视窗 3：修改 -->
        <section id="view-edit" class="view-section">
            <div class="section-header">
                <div class="section-title">> 配置修改与调整</div>
            </div>
            <div class="placeholder-box">
                [ 3. 修改功能开发中... ]
            </div>
        </section>
    </main>

    <!-- Modal 弹窗 -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑配置内容 // <span id="modalDataId" style="color: #00f0ff;"></span></div>
                <button class="btn-back" onclick="closeEditModal()">关闭</button>
            </div>
            <textarea id="configContentArea" class="code-textarea" spellcheck="false" placeholder="正在加载配置内容..."></textarea>
            <div class="modal-footer">
                <button class="btn-back" onclick="closeEditModal()">取消</button>
                <button class="page-btn" style="background: #00ff88; color: #0d1117; font-weight: bold;" onclick="saveConfigToServer()">保存并发布</button>
            </div>
        </div>
    </div>

    <!-- 模块化引入 JS -->
    <script src="js/app.js"></script>
    <script src="js/overview.js"></script>
    <script src="js/configs.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/edit.js"></script>
</body>
</html>
