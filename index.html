<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端访问 // 秘密调整基地</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #00f0ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: rgba(13, 22, 33, 0.85); border: 1px solid #00f0ff; padding: 40px; border-radius: 6px; width: 100%; max-width: 440px; }
        .title-area { margin-bottom: 30px; text-align: center; }
        .title-area h2 { font-size: 22px; color: #00ff88; margin-bottom: 8px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: #00f0ff; margin-bottom: 8px; }
        .input-group input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 4px; padding: 12px; color: #00ff88; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: transparent; border: 1px solid #00f0ff; color: #00f0ff; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-submit:hover { background: #00f0ff; color: #0d1117; }
        .error-tip { color: #ff5555; font-size: 13px; margin-top: 15px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="title-area">
        <h2>秘密调整基地</h2>
        <p>请输入 Nacos 服务凭证以接入控制台</p>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <label for="serverUrl">> 服务端地址</label>
            <input type="text" id="serverUrl" value="http://8.210.71.38:8848" required>
        </div>
        <div class="input-group">
            <label for="username">> 管理账号</label>
            <input type="text" id="username" value="nacos" autocomplete="off" required>
        </div>
        <div class="input-group">
            <label for="password">> 安全密钥</label>
            <input type="password" id="password" value="Ruv6B-WR@SF68g@5" required>
        </div>
        <button type="submit" class="btn-submit">连 接 控 制 台</button>
        <div id="errorMsg" class="error-tip"></div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const serverUrl = document.getElementById('serverUrl').value.replace(/\/$/, '');
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        // 使用 CORS 代理绕过跨域与 HTTPS 拦截
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(`${serverUrl}/nacos/v1/auth/users/login`);

        try {
            const response = await fetch(proxyUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username, password })
            });

            const data = await response.json();

            if (response.ok && data.accessToken) {
                localStorage.setItem('nacos_access_token', data.accessToken);
                localStorage.setItem('nacos_server_url', serverUrl);
                localStorage.setItem('is_authenticated', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.innerText = `[!] 登录失败: ${data.message || '账号或密码错误'}`;
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.innerText = `[!] 连接异常: ${err.message}`;
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
