<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密調整基地 // Nacos 控制台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #00f0ff; min-height: 100vh; padding: 24px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 240, 255, 0.3); padding-bottom: 16px; margin-bottom: 24px; }
        header h1 { font-size: 20px; color: #00ff88; }
        
        .btn-action { background: transparent; border: 1px solid #00f0ff; color: #00f0ff; padding: 6px 14px; font-size: 13px; cursor: pointer; border-radius: 3px; }
        .btn-action:hover { background: #00f0ff; color: #0d1117; }
        .btn-logout { border-color: #ff5555; color: #ff5555; }
        .btn-logout:hover { background: #ff5555; color: #ffffff; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .search-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(0, 240, 255, 0.4); color: #00ff88; padding: 8px 12px; border-radius: 4px; outline: none; width: 260px; font-size: 13px; }
        .search-box:focus { border-color: #00ff88; }

        /* 10列網格布局 */
        .namespace-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-bottom: 30px; }
        @media (max-width: 1600px) { .namespace-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 900px) { .namespace-grid { grid-template-columns: repeat(2, 1fr); } }
        
        .ns-card { background: rgba(13, 22, 33, 0.7); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 4px; padding: 10px 8px; cursor: pointer; text-align: center; word-break: break-all; transition: all 0.2s; }
        .ns-card:hover, .ns-card.active { border-color: #00ff88; background: rgba(0, 255, 136, 0.15); box-shadow: 0 0 12px rgba(0, 255, 136, 0.5); }
        .ns-name { font-size: 12px; font-weight: bold; color: #00ff88; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ns-id { font-size: 10px; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ns-desc { font-size: 10px; color: #58a6ff; margin-top: 4px; }
        .ns-badge { font-size: 9px; color: #00f0ff; margin-top: 2px; }

        .status-msg { font-size: 13px; color: #ff5555; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>秘密調整基地 // NACOS 控制台</h1>
    <div>
        <button class="btn-action" onclick="fetchNamespaces()">刷新資料</button>
        <button class="btn-action btn-logout" onclick="logout()">退出</button>
    </div>
</header>

<main>
    <div class="toolbar">
        <div style="font-size:15px; color:#58a6ff;">> 選擇命名空間（<span id="nsTotalCount">0</span> 個）</div>
        <input type="text" id="searchInput" class="search-box" placeholder="搜尋命名空間..." oninput="filterNamespaces()">
    </div>

    <div id="namespaceContainer" class="namespace-grid"></div>
    <div id="statusMsg" class="status-msg"></div>
</main>

<script>
    const DEFAULT_SERVER = 'http://8.210.71.38:8848';
    let globalNamespaceList = [];

    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('is_authenticated') !== 'true') {
            window.location.href = 'index.html';
            return;
        }
        fetchNamespaces();
    });

    async function fetchNamespaces() {
        const serverUrl = (localStorage.getItem('nacos_server_url') || DEFAULT_SERVER).replace(/\/$/, '');
        const container = document.getElementById('namespaceContainer');
        const statusMsg = document.getElementById('statusMsg');
        
        container.innerHTML = '<div style="color: #00f0ff; font-size: 13px; grid-column: span 10;">正在讀取 Nacos 命名空間...</div>';
        statusMsg.innerText = '';

        const token = localStorage.getItem('nacos_access_token') || '';
        const targetUrl = `${serverUrl}/nacos/v1/console/namespaces?accessToken=${token}`;
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl);
            const resData = await response.json();
            console.log("Nacos 原始回傳資料:", resData);

            // 自動解析各種可能的 JSON 格式
            if (Array.isArray(resData)) {
                globalNamespaceList = resData;
            } else if (resData && Array.isArray(resData.data)) {
                globalNamespaceList = resData.data;
            } else if (resData && resData.data && Array.isArray(resData.data.pageItems)) {
                globalNamespaceList = resData.data.pageItems;
            } else {
                globalNamespaceList = [];
                statusMsg.innerText = `[!] 資料格式異常: ${JSON.stringify(resData)}`;
            }

            document.getElementById('nsTotalCount').innerText = globalNamespaceList.length;
            renderNamespaces(globalNamespaceList);
        } catch (err) {
            container.innerHTML = '';
            statusMsg.innerText = `[!] 讀取失敗: ${err.message}`;
        }
    }

    function renderNamespaces(list) {
        const container = document.getElementById('namespaceContainer');
        container.innerHTML = '';

        if (!Array.isArray(list) || list.length === 0) {
            container.innerHTML = '<div style="color: #8b949e; grid-column: span 10;">無符合條件的命名空間</div>';
            return;
        }

        list.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'ns-card';
            if (index === 0) card.classList.add('active');

            const nsName = item.namespaceShowName || (item.namespace === "" ? "public" : item.namespace);
            const nsId = item.namespace === "" ? "public (默認)" : item.namespace;
            const desc = item.namespaceDesc || '';
            const configCount = item.configCount !== undefined ? `${item.configCount} 項配置` : '';

            card.title = `${nsName}\nID: ${nsId}\n描述: ${desc}`;

            card.innerHTML = `
                <div class="ns-name">${nsName}</div>
                <div class="ns-id">${nsId}</div>
                ${desc ? `<div class="ns-desc">${desc}</div>` : ''}
                ${configCount ? `<div class="ns-badge">${configCount}</div>` : ''}
            `;

            card.onclick = () => {
                document.querySelectorAll('.ns-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            };

            container.appendChild(card);
        });
    }

    function filterNamespaces() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = globalNamespaceList.filter(item => {
            const name = (item.namespaceShowName || '').toLowerCase();
            const id = (item.namespace || '').toLowerCase();
            const desc = (item.namespaceDesc || '').toLowerCase();
            return name.includes(query) || id.includes(query) || desc.includes(query);
        });
        renderNamespaces(filtered);
    }

    function logout() {
        localStorage.removeItem('is_authenticated');
        localStorage.removeItem('nacos_access_token');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
